
name: Actualizar indicadores adelantados (independiente)

on:
  workflow_dispatch:
  schedule:
    - cron: '47 15 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  leading:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar requests
        run: python -m pip install 'requests>=2.31,<3'

      - name: Descargar indicadores adelantados
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_leading.py

      - name: Guardar JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leading_data.json
          git diff --cached --quiet || (git commit -m "Actualizar indicadores adelantados" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
